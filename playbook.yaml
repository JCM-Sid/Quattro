# playbook.yaml — Configuration locale du projet

mode: prototyping
project_status: in_progress

packs:
  - local-first
  - git-workflow
  - git-workflow-automation

# Exclusions durables (décommentez pour activer)
disable_rules: []

check_command: "python -m unittest discover -s tests -v"

project_blurb: |
  Quattro: local implementation of the Quarto board game in Python 3.
  Modes: local 2-player, solo vs computer (3 difficulty levels), and remote multiplayer.
  UI layers: Flet (web) and Pygame (desktop). Unit tests cover core game logic.

keep_files:
  - project-overlay.mdc #?
  - project-overlay.md
